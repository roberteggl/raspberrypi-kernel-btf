name: build and release BTF

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "raspberrypi/linux branch to build. Empty means the repository default branch."
        required: false
        default: ""
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: btf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  source:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      kernel_commit: ${{ steps.source.outputs.kernel_commit }}
      short_commit: ${{ steps.source.outputs.short_commit }}
      kernel_branch: ${{ steps.source.outputs.kernel_branch }}
      tag_name: ${{ steps.source.outputs.tag_name }}
      release_exists: ${{ steps.release.outputs.exists }}
      flake_lock_sha256: ${{ steps.flake.outputs.sha256 }}
    steps:
      - name: Checkout build definitions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Hash flake.lock
        id: flake
        run: echo "sha256=$(sha256sum flake.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Resolve Raspberry Pi kernel source
        id: source
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          clone_args=(clone --depth=1)
          if [[ -n "${KERNEL_BRANCH}" ]]; then
            clone_args+=(--branch "${KERNEL_BRANCH}")
          fi
          clone_args+=(https://github.com/raspberrypi/linux linux)
          git "${clone_args[@]}"
          cd linux
          kernel_commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          resolved_branch="$(git rev-parse --abbrev-ref HEAD)"
          if [[ "${resolved_branch}" == "HEAD" ]]; then
            resolved_branch="${KERNEL_BRANCH:-default}"
          fi
          tag_name="btf-${short_commit}"
          {
            echo "kernel_commit=${kernel_commit}"
            echo "short_commit=${short_commit}"
            echo "kernel_branch=${resolved_branch}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check for existing release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.source.outputs.tag_name }}
        run: |
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: source
    if: github.event_name == 'pull_request' || needs.source.outputs.release_exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [rpi4, rpi5]
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v2

      - name: Show nix version
        run: nix --version

      - name: Set up nix dev env
        run: nix develop --command echo 0

      - name: Build ${{ matrix.target }} BTF
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          JOBS: 4
          BUILDER_REPOSITORY: ${{ github.repository }}
          BUILDER_WORKFLOW: build-and-release.yml
          BUILDER_RUN_ID: ${{ github.run_id }}
          BUILDER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILDER_SHA: ${{ github.sha }}
          FLAKE_LOCK_SHA256: ${{ needs.source.outputs.flake_lock_sha256 }}
          FLAKE_LOCK_PATH: ${{ github.workspace }}/flake.lock
        run: |
          nix develop --ignore-environment \
            --keep KERNEL_BRANCH --keep JOBS \
            --keep BUILDER_REPOSITORY --keep BUILDER_WORKFLOW \
            --keep BUILDER_RUN_ID --keep BUILDER_RUN_URL --keep BUILDER_SHA \
            --keep FLAKE_LOCK_SHA256 --keep FLAKE_LOCK_PATH \
            --command ./scripts/build-btf.sh "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }} BTF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btf-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ matrix.target }}/*.btf.zst
            dist/${{ matrix.target }}/*.metadata.json

  release:
    needs: [source, build]
    if: github.event_name != 'pull_request' && needs.source.outputs.release_exists != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Display artifacts
        run: find artifacts -maxdepth 3 -type f -print

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign artifacts (Sigstore keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for blob in artifacts/**/*.btf.zst; do
            cosign sign-blob --yes \
              --bundle "${blob}.sigstore.json" \
              "$blob"
          done

      - name: Write release notes
        env:
          KERNEL_COMMIT: ${{ needs.source.outputs.kernel_commit }}
          SHORT_COMMIT: ${{ needs.source.outputs.short_commit }}
          KERNEL_BRANCH: ${{ needs.source.outputs.kernel_branch }}
          FLAKE_LOCK_SHA256: ${{ needs.source.outputs.flake_lock_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## Detached BTF for \`raspberrypi/linux\` \`${SHORT_COMMIT}\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Kernel repository | https://github.com/raspberrypi/linux |"
            echo "| Kernel branch | \`${KERNEL_BRANCH}\` |"
            echo "| Kernel commit | [\`${KERNEL_COMMIT}\`](https://github.com/raspberrypi/linux/commit/${KERNEL_COMMIT}) |"
            echo "| Builder repository | [\`${REPO}\`](https://github.com/${REPO}) |"
            echo "| Workflow run | [actions run ${{ github.run_id }}](${RUN_URL}) |"
            echo "| \`flake.lock\` SHA-256 | \`${FLAKE_LOCK_SHA256}\` |"
            echo
            echo "### Targets"
            echo
            echo "- **rpi4** — \`bcm2711_defconfig\`, arm64"
            echo "- **rpi5** — \`bcm2712_defconfig\`, arm64"
            echo
            echo "### Digests"
            echo
            echo '```'
            find artifacts -name '*.sha256' -print0 | sort -z | xargs -0 cat
            echo '```'
            echo
            echo "### Verify"
            echo
            echo '```sh'
            echo "./scripts/verify-release.sh ./raspberrypi-linux-${SHORT_COMMIT}-rpi5-*.btf.zst"
            echo "gh attestation verify ./raspberrypi-linux-${SHORT_COMMIT}-rpi5-*.btf.zst --repo ${REPO}"
            echo '```'
            echo
            echo "See [PROVENANCE.md](https://github.com/${REPO}/blob/main/PROVENANCE.md)."
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.source.outputs.tag_name }}
          name: raspberrypi/linux BTF ${{ needs.source.outputs.short_commit }}
          body_path: release-notes.md
          files: |
            artifacts/**/*
          fail_on_unmatched_files: true
